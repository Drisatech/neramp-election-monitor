name: NERAMP validation

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/canonical-node-ingestion

jobs:
  node-contract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test ingestion contract
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
