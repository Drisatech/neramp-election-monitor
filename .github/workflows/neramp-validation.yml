name: NERAMP validation

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/canonical-node-ingestion

jobs:
  node-contract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test ingestion contract
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build

  legacy-python-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Test legacy adapter contracts
        run: python -m unittest backend.tests.test_adapters
