name: NERAMP validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hardening/canonical-ingestion-provenance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neramp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Type-check project
        run: npm run lint

      - name: Run security integration test suite
        run: npm run test:security
        # API integration cases require a separately provisioned staging URL and
        # test accounts. Without NERAMP_TEST_BASE_URL, node:test reports them skipped.
