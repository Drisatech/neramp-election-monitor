services:
  - type: web
    name: nigeria-election-watch
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INEC_RESULTS_API_BASE_URL
        sync: false
    # To permanently prevent data from resetting on deployment, attach a Render Persistent Disk:
    # (Requires Render Starter plan or above: Render Dashboard -> Your Service -> Disks -> Add Disk: Mount Path /var/data)
    # disk:
    #   name: neramp-data
    #   mountPath: /var/data
    #   sizeGB: 1

