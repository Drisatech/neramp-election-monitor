services:
  - type: web
    name: nigeria-election-watch
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INEC_RESULTS_API_BASE_URL
        sync: false
      - key: NERAMP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: NERAMP_REQUIRE_DURABLE_STORAGE
        value: "true"
    # IMPORTANT: This service must have a real persistent disk mounted at /var/data.
    # Render persistent disks require a paid service plan. Attach the disk in the Render
    # dashboard before deploying this blueprint; readiness intentionally fails closed
    # when NERAMP_REQUIRE_DURABLE_STORAGE=true and no persistent volume is detected.
    # disk:
    #   name: neramp-data
    #   mountPath: /var/data
    #   sizeGB: 1

