services:
  - type: web
    name: nigeria-election-watch
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INEC_RESULTS_API_BASE_URL
        sync: false
      - key: NERAMP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: NERAMP_REQUIRE_DURABLE_STORAGE
        value: "false"
    # FREE-PLAN MODE: no persistent disk is provisioned. The app can remain available,
    # but local JSON state, uploaded evidence, sessions, and local backups may be lost
    # when Render restarts or redeploys the instance. Readiness reports this warning
    # without blocking the free instance. Do not use this deployment as the sole store
    # of authoritative election records. Paid-plan disk example (optional):
    # disk:
    #   name: neramp-data
    #   mountPath: /var/data
    #   sizeGB: 1

