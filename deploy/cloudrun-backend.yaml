apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: election-watch-backend
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/client-name: gcloud
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "50"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:REGION:election-watch-db"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/election-watch-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATA_SOURCE_MODE
              value: "OFFICIAL_SOURCE"
            - name: IS_DEMONSTRATION
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: election-watch-secrets
                  key: database_url
            - name: SYNC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: election-watch-secrets
                  key: sync_database_url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: election-watch-secrets
                  key: secret_key
            - name: INEC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: election-watch-secrets
                  key: inec_api_key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: election-watch-secrets
                  key: redis_url
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
